[package]
name = "launchpad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oxichrome = { path = "../../oxichrome" }
leptos = { version = "0.8", features = ["csr"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "KeyboardEvent"] }
serde_json = "1"
