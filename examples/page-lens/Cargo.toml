[package]
name = "page-lens"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oxichrome = { path = "../../oxichrome" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
web-sys = { version = "0.3", features = ["Document", "Element", "EventTarget", "HtmlElement", "HtmlDocument", "HtmlTextAreaElement", "HtmlCollection", "NodeList", "Node", "Window", "ScrollIntoViewOptions", "ScrollBehavior"] }
