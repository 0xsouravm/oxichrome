[package]
name = "page-lens"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oxichrome = { path = "../../oxichrome" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "HtmlDocument", "HtmlTextAreaElement", "HtmlCollection", "NodeList", "Node", "Window", "Selection", "CssStyleDeclaration", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition"] }
