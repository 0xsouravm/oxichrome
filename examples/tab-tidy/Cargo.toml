[package]
name = "tab-tidy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oxichrome = { path = "../../oxichrome" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "KeyboardEvent", "HtmlInputElement"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
